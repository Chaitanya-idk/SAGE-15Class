# Training Configuration for Qwen2.5-VL-3B-Instruct QLoRA Fine-Tuning
model:
  model_id: "/kaggle/input/models/qwen-lm/qwen2.5-vl/transformers/3b-instruct/2"
  torch_dtype: "auto" # automatically selects bfloat16 if GPU supports, else float16
  attn_implementation: "flash_attention_2" # falls back to sdpa if unsupported
  use_gradient_checkpointing: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16" # falls back to float16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  epochs: 2
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  min_learning_rate: 1.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  num_workers: 4
  pin_memory: true
  save_every_n_steps: 100
  eval_every_n_steps: 200
  logging_steps: 10
  preflight_smoke_test_samples: 4

prompt:
  instruction: "Identify the crop and plant disease visible in the image. Return the output strictly in the format:\nCrop: <Crop>\nDisease: <Disease>"
  max_new_tokens: 64

checkpointing:
  checkpoint_dir: "artifacts/checkpoints"
  save_best: true
  metric_for_best: "exact_match_acc"
  greater_is_better: true
  max_checkpoints_to_keep: 3
  atomic_save: true
  progress_file: "artifacts/checkpoints/training_progress.json"
